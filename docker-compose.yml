
services:
  app:
    build:
      context: .
      target: base
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    image: instructor-ledger-app:latest
    working_dir: /var/www/Instructor-ledger
    volumes:
      - .:/var/www/Instructor-ledger
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - instructor-network

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/Instructor-ledger:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - instructor-network

  queue:
    build:
      context: .
      target: base
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    image: instructor-ledger-app:latest
    working_dir: /var/www/Instructor-ledger
    command: php artisan horizon
    volumes:
      - .:/var/www/Instructor-ledger
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped
    networks:
      - instructor-network

  scheduler:
    build:
      context: .
      target: base
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    image: instructor-ledger-app:latest
    working_dir: /var/www/Instructor-ledger
    command: php artisan schedule:work
    volumes:
      - .:/var/www/Instructor-ledger
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - instructor-network

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-Instructor_ledger}"
      MYSQL_USER: "${DB_USERNAME:-Instructor_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - instructor-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${FORWARD_REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - instructor-network

  test:
    build:
      context: .
      target: base
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    image: instructor-ledger-app:latest
    working_dir: /var/www/Instructor-ledger
    volumes:
      - .:/var/www/Instructor-ledger
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - APP_ENV=testing
      - DB_DATABASE=Instructor_ledger_test
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - test
    command: ./vendor/bin/pest
    networks:
      - instructor-network

volumes:
  mysql_data:
  redis_data:

networks:
  instructor-network:
    driver: bridge
